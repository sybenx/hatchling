/* ── skeletons ──────────────────────────────────────────────────────────── */

function skeletonCard() {
  return el('article', { class: 'card skel-card', 'aria-hidden': 'true' },
    el('div', { style: 'display:flex;gap:10px;align-items:center' },
      el('div', { class: 'skel', style: 'width:42px;height:42px;border-radius:50%;flex:0 0 auto' }),
      el('div', { style: 'flex:1 1 auto' },
        el('div', { class: 'skel', style: 'height:11px;width:40%' }),
        el('div', { class: 'skel skel-line', style: 'width:26%' })),
    ),
    el('div', { class: 'skel skel-line', style: 'margin-top:16px;width:100%' }),
    el('div', { class: 'skel skel-line', style: 'width:92%' }),
    el('div', { class: 'skel skel-line', style: 'width:64%' }),
  );
}

function skeletonList(n = 4) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) frag.append(skeletonCard());
  return frag;
}

function emptyState(icon, text) {
  return el('div', { class: 'empty' }, el('div', { html: icon }), el('div', { text }));
}

function loadingLine(text = 'Loading…') {
  return el('div', { class: 'loading-line' }, el('span', { class: 'spin' }), el('span', { text }));
}

/* ═══════════════════════════════════════════════════════════════════════════
   SPEC §5 — view stack

   A stack, not a single "back to feed". Feed → note → author profile → one of
   their notes → its parent is a normal path and back unwinds it one step at a
   time. Views below the top stay mounted with their scroll position intact, so
   coming back is instant and lands exactly where you left.
   ═══════════════════════════════════════════════════════════════════════════ */

const views = {
  stack: [],
  _host: null,

  init(host) { this._host = host; },
  get top() { return this.stack[this.stack.length - 1] ?? null; },
  get current() { return this.top; },

  push(controller) {
    const prev = this.top;
    if (prev) {
      prev._scrollTop = prev.el.scrollTop;
      prev.el.hidden = true;
    }
    this.stack.push(controller);
    this._host.append(controller.el);
    controller.el.hidden = false;
    this._sync();
    try { history.pushState({ depth: this.stack.length }, ''); } catch { /* file:// */ }
  },

  replaceRoot(controller) {
    for (const v of this.stack) { v.destroy?.(); v.el.remove(); }
    this.stack = [controller];
    this._host.append(controller.el);
    this._sync();
  },

  pop() {
    if (this.stack.length <= 1) return false;
    const top = this.stack.pop();
    top.destroy?.();
    top.el.remove();
    const next = this.top;
    next.el.hidden = false;
    next.el.scrollTop = next._scrollTop ?? 0;
    this._sync();
    return true;
  },

  back() {
    if (this.stack.length <= 1) return;
    // Let popstate drive the pop when history is available, so the browser /
    // Android back button and this button stay in step.
    try {
      if (history.state?.depth) { history.back(); return; }
    } catch { /* file:// */ }
    this.pop();
  },

  _sync() {
    const top = this.top;
    $('#back-btn').hidden = this.stack.length <= 1;
    const crumb = $('#crumb');
    if (this.stack.length <= 1 || !top?.title) {
      crumb.hidden = true;
    } else {
      crumb.hidden = false;
      crumb.textContent = top.title;
    }
    document.title = top?.title ? `${top.title} · hatchling` : 'hatchling';
  },

  each(fn) { for (const v of this.stack) fn(v); },
};

function refreshAllFilters() { views.each((v) => v.refreshFilters?.()); }

/** Shell every view shares. */
function viewShell() {
  const inner = el('div', { class: 'view-inner' });
  const root = el('section', { class: 'view entering' }, inner);
  setTimeout(() => root.classList.remove('entering'), 220);
  return { root, inner };
}

/* ── dwell observer (SPEC §7) ───────────────────────────────────────────────
   One observer per feed. `shown` and `dwell_ms` come from here; dwell only
   accrues while the tab is foregrounded (see telemetry.enter/leave).
   ─────────────────────────────────────────────────────────────────────────── */

const dwellGroups = new Set();

function makeDwellObserver(root) {
  const visible = new Set();
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      const pk = e.target.dataset.pubkey;
      if (!pk) continue;
      if (e.isIntersecting && e.intersectionRatio >= 0.5) {
        visible.add(pk);
        // Time on a backgrounded tab is not attention; the clock starts again
        // from resumeDwell() when the tab comes forward.
        if (document.visibilityState === 'visible') telemetry.enter(pk);
      } else {
        visible.delete(pk);
        telemetry.leave(pk);
      }
    }
  }, { root, threshold: [0, 0.5, 1] });

  const group = {
    visible,
    observe: (node) => io.observe(node),
    unobserve: (node) => io.unobserve(node),
    disconnect: () => {
      dwellGroups.delete(group);
      for (const pk of visible) telemetry.leave(pk);
      visible.clear();
      io.disconnect();
    },
  };
  dwellGroups.add(group);
  return group;
}

/** A card can already be on screen when the tab comes forward — no new
    intersection fires for it, so restart those clocks explicitly. */
function resumeDwell() {
  for (const g of dwellGroups) for (const pk of g.visible) telemetry.enter(pk);
}

/* ═══════════════════════════════════════════════════════════════════════════
   Feed (SPEC §5)
   ═══════════════════════════════════════════════════════════════════════════ */

function createFeedView() {
  const { root, inner } = viewShell();
  const list = el('div');
  const tail = el('div');
  const skeletons = el('div', {}, skeletonList(4));
  inner.append(skeletons, list, tail);

  const observer = makeDwellObserver(root);
  const cards = new Map();          // pubkey -> card element
  const notesByAuthor = new Map();  // pubkey -> events
  let order = [];                   // candidate pubkeys in DVM rank order
  let painted = new Set();
  let sub = null;
  let killed = false;
  let firstPaintDone = false;

  const ctrl = {
    el: root,
    title: null,
    destroy() {
      killed = true;
      observer.disconnect();
      telemetry.bankAll();
      try { sub?.close(); } catch { /* noop */ }
    },
    refreshFilters() {
      for (const [pk, card] of cards) {
        const hide = isHidden(pk);
        if (hide && !card.hidden) { telemetry.leave(pk); card.hidden = true; }
        else if (!hide && card.hidden) card.hidden = false;
      }
      checkEmpty();
    },
    removeAuthor(pk) {
      const card = cards.get(pk);
      if (!card || card.hidden) return;
      telemetry.leave(pk);
      card.classList.add('dismissing');
      setTimeout(() => {
        card.hidden = true;
        card.classList.remove('dismissing');
        checkEmpty();
      }, 170);
    },
    restoreAuthor(pk) {
      const card = cards.get(pk);
      if (!card) return;
      card.hidden = false;
      emptyNode?.remove();
      emptyNode = null;
    },
    reload() { start(); },
  };

  let emptyNode = null;
  function checkEmpty() {
    const anyVisible = [...cards.values()].some((c) => !c.hidden);
    if (!anyVisible && !emptyNode && firstPaintDone) {
      emptyNode = emptyState(I.inbox,
        'Nothing left in this batch. Everything here was muted or dismissed.');
      tail.append(emptyNode);
    } else if (anyVisible && emptyNode) {
      emptyNode.remove();
      emptyNode = null;
    }
  }

  function buildCard(cand) {
    const notes = (notesByAuthor.get(cand.pubkey) || []).slice(0, NOTES_PER_CANDIDATE);
    const card = el('article', { class: 'card', 'data-pubkey': cand.pubkey },
      authorHeader(cand.pubkey, { menuContext: 'profile', ctx: {} }),
      cand.reason ? el('div', { class: 'reason' }, el('span', { html: I.sparkle }),
        el('span', { text: cand.reason })) : null,
      el('div', { class: 'notes' }, notes.map(noteBlock)),
    );
    if (isHidden(cand.pubkey)) card.hidden = true;
    cards.set(cand.pubkey, card);
    observer.observe(card);
    return card;
  }

  /** Paint every candidate that has a note, in the ranker's order. */
  function paintFirstBatch(candidates) {
    if (firstPaintDone || killed) return;
    firstPaintDone = true;
    skeletons.remove();
    const frag = document.createDocumentFragment();
    for (const c of candidates) {
      if (!notesByAuthor.get(c.pubkey)?.length) continue;
      painted.add(c.pubkey);
      frag.append(buildCard(c));
    }
    list.append(frag);
    if (!painted.size) {
      tail.append(loadingLine('Waiting on relays…'));
    }
    checkEmpty();
  }

  /** Late arrivals append below the fold — never inserted above what you read. */
  function paintLate(cand) {
    if (!firstPaintDone || killed || painted.has(cand.pubkey)) return;
    if (!notesByAuthor.get(cand.pubkey)?.length) return;
    painted.add(cand.pubkey);
    tail.querySelector('.loading-line')?.remove();
    list.append(buildCard(cand));
    checkEmpty();
  }

  async function start() {
    const candidates = (await dvm.fetchCandidates({ limit: 12 }))
      .filter((c) => /^[0-9a-f]{64}$/.test(c.pubkey));
    if (killed) return;

    for (const c of candidates) candidateSet.add(c.pubkey);
    order = candidates.map((c) => c.pubkey);
    profiles.request(order);

    // One REQ, one filter per candidate: relays apply `limit` per filter, so
    // this gets recent notes per author without one subscription each.
    const filters = candidates.map((c) => (
      c.sampleEventIds?.length
        ? { ids: c.sampleEventIds }
        : { kinds: [1], authors: [c.pubkey], limit: 8 }
    ));

    const paintTimer = setTimeout(() => paintFirstBatch(candidates), FEED_FIRST_PAINT_MS);

    sub = subscribe(filters, {
      onevent: (ev) => {
        if (ev.kind !== 1 || !order.includes(ev.pubkey)) return;
        const arr = notesByAuthor.get(ev.pubkey) || [];
        if (arr.some((e) => e.id === ev.id)) return;
        arr.push(ev);
        // Top-level notes read best in a discovery feed; fall back to replies
        // only for an author who has nothing else.
        arr.sort((a, b) => (isReply(a) - isReply(b)) || (b.created_at - a.created_at));
        notesByAuthor.set(ev.pubkey, arr);
        if (firstPaintDone) paintLate(candidates.find((c) => c.pubkey === ev.pubkey));
      },
      oneose: () => {
        clearTimeout(paintTimer);
        paintFirstBatch(candidates);
      },
      maxWait: FEED_FIRST_PAINT_MS,
    });

    setTimeout(() => {
      try { sub?.close(); } catch { /* noop */ }
      if (killed) return;
      tail.querySelector('.loading-line')?.remove();
      if (!painted.size) {
        tail.append(emptyState(I.relay,
          'No notes came back from your relays. Check the relay list, then try again.'));
      }
    }, FEED_SETTLE_MS);
  }

  start();
  return ctrl;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Thread (SPEC §5) — a note plus its replies
   ═══════════════════════════════════════════════════════════════════════════ */

function createThreadView(note) {
  const { root, inner } = viewShell();
  const replies = el('div');
  const status = loadingLine('Loading replies…');

  inner.append(
    noteCard(note, { extraClass: 'thread-root' }),
    el('div', { class: 'replies-hd' }, el('span', { text: 'Replies' }), el('span', { class: 'rule' })),
    status,
    replies,
  );

  const seen = new Set();
  const byId = new Map();
  let sub = null, killed = false;

  function insert(ev) {
    if (seen.has(ev.id) || isMuted(ev.pubkey)) return;
    seen.add(ev.id);
    byId.set(ev.id, ev);
    const card = noteCard(ev, { extraClass: 'reply-card' });
    card.dataset.ts = String(ev.created_at);
    // keep ascending by created_at without re-sorting the DOM
    const after = [...replies.children].find((c) => Number(c.dataset.ts) > ev.created_at);
    replies.insertBefore(card, after ?? null);
    status.remove();
    profiles.request([ev.pubkey]);
  }

  sub = subscribe([{ kinds: [1], '#e': [note.id], limit: 200 }], {
    onevent: (ev) => { if (!killed && isDirectReplyTo(ev, note.id)) insert(ev); },
    oneose: () => {
      status.remove();
      if (!seen.size && !killed) {
        replies.append(emptyState(I.reply, 'No replies yet.'));
      }
      setTimeout(() => { try { sub?.close(); } catch { /* noop */ } }, 4000);
    },
    maxWait: 6000,
  });

  return {
    el: root,
    title: profiles.displayName(note.pubkey) + "'s note",
    destroy() { killed = true; try { sub?.close(); } catch { /* noop */ } },
    refreshFilters() {
      for (const card of replies.children) {
        if (card.dataset.pubkey && isMuted(card.dataset.pubkey)) card.hidden = true;
      }
    },
    removeAuthor(pk) {
      for (const card of replies.children) if (card.dataset.pubkey === pk) card.hidden = true;
    },
    restoreAuthor(pk) {
      for (const card of replies.children) if (card.dataset.pubkey === pk) card.hidden = false;
    },
    onLocalReply(ev, parentId) {
      if (parentId === note.id) {
        replies.querySelector('.empty')?.remove();
        insert(ev);
      }
    },
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   Profile (SPEC §5)

   Tabs: notes / notes + replies / zapped-most. The last needs the author's
   full zap-receipt history, which is a heavy relay query — it is declared
   here and lands with zap display in M3. It is never loaded on profile open.
   ═══════════════════════════════════════════════════════════════════════════ */

const PROFILE_TABS = [
  { id: 'notes', label: 'Notes', enabled: true },
  { id: 'replies', label: 'Notes + replies', enabled: true },
  { id: 'zapped', label: 'Zapped-most', enabled: false },
];

function createProfileView(pubkey) {
  const { root, inner } = viewShell();

  /* header — banner and avatar are fixed boxes, so images fade in without
     moving a single pixel below them. */
  const banner = el('div', { class: 'banner', style: gradientFor(pubkey) });
  const bannerImg = el('img', { alt: '', decoding: 'async' });
  bannerImg.addEventListener('load', () => bannerImg.classList.add('on'));
  bannerImg.addEventListener('error', () => bannerImg.classList.remove('on'));
  banner.append(bannerImg);

  const nameEl = el('div', { class: 'pf-name pending' });
  const aboutEl = el('div', { class: 'pf-about' });
  const metaRow = el('div', { class: 'pf-meta' });

  const menuBtn = el('button', {
    class: 'icon-btn', type: 'button', 'aria-label': 'Profile actions', html: I.more,
    onclick: (e) => openActionMenu('profile', { pubkey, trigger: e.currentTarget }),
  });

  const header = el('div', { class: 'pf' }, banner,
    el('div', { class: 'pf-body' },
      el('div', { class: 'pf-top' }, avatarEl(pubkey, { lg: true }), menuBtn),
      nameEl,
      el('div', { class: 'sub-row' }, el('span', { class: 'npub', text: shortNpub(pubkey) })),
      aboutEl,
      metaRow,
    ));

  function paintMeta(meta) {
    nameEl.classList.remove('pending');
    nameEl.textContent = profiles.displayName(pubkey);
    if (meta?.about) renderContentInto(aboutEl, meta.about);

    metaRow.textContent = '';
    if (meta?.nip05) {
      // SPEC §6 — never show a name as verified without resolving it.
      // Resolution lands in M2; until then this states plainly that it is
      // an unchecked claim.
      metaRow.append(el('span', {
        class: 'chip warn',
        title: 'nip05 resolution lands in M2. Until then this is the claim in the profile, not a verified identity.',
      }, el('span', { html: I.shield }), el('span', { text: meta.nip05 + ' · unverified' })));
    }
    if (isMuted(pubkey)) {
      metaRow.append(el('span', { class: 'chip muted-flag' },
        el('span', { html: I.mute }), el('span', { text: 'Muted' })));
      metaRow.append(el('button', {
        class: 'chip', type: 'button', text: 'Unmute', onclick: () => undoMute(pubkey),
      }));
    }
    if (dismissed.has(pubkey)) {
      metaRow.append(el('span', { class: 'chip' }, el('span', { html: I.hide }),
        el('span', { text: 'Hidden from your feed' })));
      metaRow.append(el('button', {
        class: 'chip', type: 'button', text: 'Un-hide',
        onclick: () => {
          removeDismissed(pubkey);
          markCandidate(pubkey, 'not_interested', false);
          refreshAllFilters();
          paintMeta(profiles.get(pubkey));
          toast('Restored to your feed.');
        },
      }));
    }
  }

  profiles.bind(pubkey, (meta) => {
    const url = safeImageUrl(meta?.banner);
    if (url) bannerImg.src = url;
    paintMeta(meta);
  });

  /* tabs */
  let tab = 'notes';
  const tabsRow = el('div', { class: 'tabs', role: 'tablist' });
  const tabButtons = new Map();
  for (const t of PROFILE_TABS) {
    const b = el('button', {
      class: 'tab', role: 'tab', type: 'button',
      'aria-selected': String(t.id === tab),
      disabled: !t.enabled,
      title: t.enabled ? '' : 'Needs the full zap-receipt history — lands with zap display in M3.',
      onclick: () => selectTab(t.id),
    }, el('span', { text: t.label }), t.enabled ? null : el('span', { class: 'soon', text: 'soon' }));
    tabButtons.set(t.id, b);
    tabsRow.append(b);
  }

  const listEl = el('div');
  const status = loadingLine('Loading notes…');
  inner.append(header, tabsRow, status, listEl);

  const events = [];
  const seen = new Set();
  let sub = null, killed = false;

  /* SPEC §7 — profile_notes_scrolled, counted once per distinct note. */
  const counted = new Set();
  const scrollObs = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting || e.intersectionRatio < 0.5) continue;
      const id = e.target.dataset.id;
      if (!id || counted.has(id)) continue;
      counted.add(id);
      bumpCandidate(pubkey, 'profile_notes_scrolled', 1);
      scrollObs.unobserve(e.target);
    }
  }, { root, threshold: [0.5] });

  function visibleEvents() {
    return events
      .filter((ev) => tab === 'replies' || !isReply(ev))
      .sort((a, b) => b.created_at - a.created_at);
  }

  function paint() {
    listEl.textContent = '';
    counted.clear();
    const rows = visibleEvents();
    if (!rows.length) {
      listEl.append(killed || sub == null
        ? emptyState(I.inbox, 'No notes found on your relays.')
        : loadingLine('Loading notes…'));
      return;
    }
    const frag = document.createDocumentFragment();
    for (const ev of rows) {
      const card = noteCard(ev);
      frag.append(card);
    }
    listEl.append(frag);
    for (const card of listEl.children) if (card.dataset.id) scrollObs.observe(card);
  }

  function selectTab(id) {
    if (id === tab) return;
    tab = id;
    for (const [k, b] of tabButtons) b.setAttribute('aria-selected', String(k === id));
    paint();
  }

  sub = subscribe([{ kinds: [1], authors: [pubkey], limit: 60 }], {
    onevent: (ev) => {
      if (killed || seen.has(ev.id)) return;
      seen.add(ev.id);
      events.push(ev);
      status.remove();
      schedulePaint();
    },
    oneose: () => {
      status.remove();
      schedulePaint();
      setTimeout(() => { try { sub?.close(); } catch { /* noop */ } }, 3000);
    },
    maxWait: 6000,
  });

  let paintTimer = null;
  function schedulePaint() {
    clearTimeout(paintTimer);
    paintTimer = setTimeout(() => { if (!killed) paint(); }, 220);
  }

  return {
    el: root,
    title: profiles.displayName(pubkey),
    destroy() {
      killed = true;
      scrollObs.disconnect();
      clearTimeout(paintTimer);
      try { sub?.close(); } catch { /* noop */ }
    },
    refreshFilters() { paintMeta(profiles.get(pubkey)); },
    removeAuthor(pk) { if (pk === pubkey) paintMeta(profiles.get(pubkey)); },
    restoreAuthor(pk) { if (pk === pubkey) paintMeta(profiles.get(pubkey)); },
  };
}

/* ── navigation entry points ────────────────────────────────────────────── */

function openThread(note) {
  markCandidate(note.pubkey, 'opened', true);
  views.push(createThreadView(note));
}

function openProfile(pubkey) {
  markCandidate(pubkey, 'opened_profile', true);
  views.push(createProfileView(pubkey));
}

/* ═══════════════════════════════════════════════════════════════════════════
   relays panel (SPEC §4 — user-editable and persisted)
   ═══════════════════════════════════════════════════════════════════════════ */

function openRelayPanel() {
  const body = el('div', { class: 'composer' });
  const rows = el('div');
  const input = el('input', { class: 'inp', type: 'text', placeholder: 'wss://relay.example.com', 'aria-label': 'Relay URL' });
  let dirty = false;

  function draw() {
    rows.textContent = '';
    for (const url of relays) {
      rows.append(el('div', { class: 'relay-row' },
        el('span', { class: 'relay-url', text: url }),
        el('button', {
          class: 'icon-btn', type: 'button', 'aria-label': 'Remove ' + url, html: I.trash,
          onclick: () => { setRelays(relays.filter((u) => u !== url)); dirty = true; draw(); },
        }),
      ));
    }
    if (!relays.length) rows.append(el('div', { class: 'menu-note', text: 'No relays — defaults will be restored.' }));
  }

  function add() {
    const url = input.value.trim();
    if (!isRelayUrl(url)) { toast('That is not a wss:// relay URL.', { error: true }); return; }
    if (relays.includes(url)) { toast('Already in the list.'); return; }
    setRelays([...relays, url]);
    input.value = '';
    dirty = true;
    draw();
  }
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });

  draw();
  body.append(
    rows,
    el('div', { style: 'display:flex;gap:8px;margin-top:12px' },
      input,
      el('button', { class: 'btn', type: 'button', html: I.plus, 'aria-label': 'Add relay', onclick: add })),
    el('div', { class: 'row-end' },
      el('span', { class: 'hint', text: 'Read set. Publishing uses the same list.' }),
      el('button', {
        class: 'btn', type: 'button', text: 'Restore defaults',
        onclick: () => { setRelays([...DEFAULT_RELAYS]); dirty = true; draw(); },
      }),
      el('button', {
        class: 'btn primary', type: 'button', text: 'Done',
        onclick: () => {
          closeSheet();
          if (dirty) { toast('Relay list saved. Reloading the feed.'); views.replaceRoot(createFeedView()); }
        },
      })),
  );

  openSheet({ title: 'Relays', padded: true, body });
}

/* ═══════════════════════════════════════════════════════════════════════════
   privacy panel (SPEC §7 — a plain-language statement of exactly what leaves
   the device, plus the actual buffer so the statement is checkable)
   ═══════════════════════════════════════════════════════════════════════════ */

function openPrivacyPanel() {
  const buffer = telemetry.preview();
  const body = el('div', { class: 'composer prose' },
    el('p', {}, el('strong', { text: 'hatchling reports how you react to the accounts it shows you, and nothing else.' }),
      ' That feedback is what the discovery ranker learns from. It is sent anonymously.'),

    el('h4', { text: 'What leaves this device' }),
    el('ul', {},
      el('li', {}, 'For each account the feed shows you: its public key, whether it was on screen, roughly how long, and which of these you did — opened it, opened its profile, scrolled its notes, reacted, replied, bookmarked, followed, muted, or marked not interested.'),
      el('li', {}, 'Nothing else. The batch is sent every 30 seconds and when you leave the tab.'),
    ),

    el('h4', { text: 'What never leaves this device' }),
    el('ul', {},
      el('li', {}, el('strong', { text: 'Your identity.' }), ' Your public key is never attached. ',
        el('code', { text: 'shareIdentity' }), ' is ', el('code', { text: 'false' }), ' and there is no setting to turn it on.'),
      el('li', {}, 'The text of anything you read, write, or reply with.'),
      el('li', {}, 'Your relay list, your follow list, or your mute list.'),
      el('li', {}, 'Timestamps finer than the batch itself.'),
    ),

    el('h4', { text: 'Where it goes' }),
    el('p', {}, 'To the discovery service at ', el('code', { text: DVM_BASE_URL }),
      '. In this build nothing is sent anywhere: the mock service prints each batch to the browser console instead.'),

    el('h4', { text: `Buffered right now — ${buffer.length} record${buffer.length === 1 ? '' : 's'}` }),
    el('pre', { class: 'json', text: buffer.length ? JSON.stringify(buffer, null, 2) : '[]' }),

    el('div', { class: 'row-end' },
      el('span', { class: 'hint', text: 'This is the exact payload, verbatim.' }),
      el('button', {
        class: 'btn', type: 'button', text: 'Clear buffer',
        onclick: () => {
          telemetry.records.clear();
          telemetry.dirty.clear();
          telemetry.save();
          closeSheet();
          toast('Buffer cleared. Nothing was sent.');
        },
      }),
      el('button', { class: 'btn primary', type: 'button', text: 'Close', onclick: () => closeSheet() })),
  );

  openSheet({ title: 'What leaves this device', padded: true, body });
}

/* ═══════════════════════════════════════════════════════════════════════════
   signer panel
   ═══════════════════════════════════════════════════════════════════════════ */

function openSignerPanel() {
  const pk = signer.pubkey;
  const body = el('div', { class: 'composer prose' },
    el('p', {}, 'Signed in as ', el('code', { text: shortNpub(pk) }), '.'),
    el('p', {}, 'hatchling only ever asks your signer to sign what you explicitly publish: replies, reactions and mute-list updates. Your key never touches this page.'),
    el('div', { class: 'row-end' },
      el('button', { class: 'btn', type: 'button', text: 'Copy npub', onclick: async () => {
        toast(await copyText(npubOf(pk)) ? 'npub copied.' : 'Could not copy.', { error: false });
      } }),
      el('button', { class: 'btn', type: 'button', text: 'Disconnect', onclick: () => { closeSheet(); signer.disconnect(); } }),
      el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: () => closeSheet() })),
  );
  openSheet({ title: 'Signer', padded: true, body });
}

/* ═══════════════════════════════════════════════════════════════════════════
   boot
   ═══════════════════════════════════════════════════════════════════════════ */

function paintSignerButton() {
  const btn = $('#signer-btn');
  btn.dataset.state = signer.state;
  const lbl = $('.lbl', btn);
  lbl.textContent = signer.state === 'connected' ? shortNpub(signer.pubkey)
    : signer.state === 'connecting' ? 'Connecting…'
      : 'Connect';
  btn.title = signer.state === 'connected' ? 'Signer connected' : 'Connect a NIP-07 signer';
}

/** Actions that need a signer flip live when the signer state changes. */
function refreshActionAvailability() {
  for (const btn of document.querySelectorAll('[data-action]')) {
    const a = actionById.get(btn.dataset.action);
    if (!a) continue;
    const reason = disabledReason(a);
    btn.disabled = !!reason;
    btn.title = reason || a.label;
  }
}

function boot() {
  $('#brand-egg').innerHTML = I.egg;
  $('#back-btn').innerHTML = I.back;
  $('#privacy-btn').innerHTML = I.shield;
  $('#relays-btn').innerHTML = I.relay;

  $('#back-btn').addEventListener('click', () => views.back());
  $('#privacy-btn').addEventListener('click', openPrivacyPanel);
  $('#relays-btn').addEventListener('click', openRelayPanel);
  $('#signer-btn').addEventListener('click', () => {
    if (signer.connected) openSignerPanel();
    else signer.connect();
  });

  signer.onChange(() => { paintSignerButton(); refreshActionAvailability(); });
  paintSignerButton();

  telemetry.load();
  views.init($('#views'));
  views.replaceRoot(createFeedView());

  // Back button / gesture unwinds the view stack one step at a time.
  window.addEventListener('popstate', (e) => {
    const depth = e.state?.depth ?? 1;
    while (views.stack.length > Math.max(1, depth)) {
      if (!views.pop()) break;
    }
  });

  // SPEC §7 — flush every 30s and on visibilitychange.
  setInterval(() => telemetry.flush('interval'), FLUSH_INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      telemetry.bankAll();
      telemetry.flush('visibilitychange');
    } else {
      resumeDwell();
    }
  });
  window.addEventListener('pagehide', () => { telemetry.bankAll(); telemetry.save(); });

  if (lsGet(LS.autoconn, false) && Nip07Signer.isAvailable()) {
    signer.connect({ silent: true });
  }

  console.info(
    '%chatchling%c M1 — feed. Telemetry batches print here; open the shield icon to see exactly what would be sent.',
    'color:#f2a93b;font-weight:700', 'color:inherit',
  );
}

boot();
</script>
